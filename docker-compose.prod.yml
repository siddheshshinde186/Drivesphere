# ===================================================================
# DriveSphere – Production Docker Compose Stack
# Architecture:
#   Internet -> Host Port 80 (or Reverse Proxy/SSL)
#            -> drivesphere-frontend (Nginx Proxy)
#            -> drivesphere-backend (Internal Network Only: 8080)
#            -> drivesphere-db (Internal Network Only: 3306)
#
# Production Security Invariants:
#   1. MySQL port 3306 is NOT published to host or internet.
#   2. Backend port 8080 is NOT published to host or internet.
#   3. Flyway is the exclusive source of truth for schema migrations.
#   4. Demo data seeding is disabled (DRIVESPHERE_DEMO_DATA_ENABLED=false).
#   5. Mock payments and GPS simulation are strictly disabled.
# ===================================================================

services:
  drivesphere-db:
    image: mysql:8.0
    container_name: drivesphere-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-drivesphere}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - prod_db_data:/var/lib/mysql
    networks:
      - drivesphere-internal
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  drivesphere-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drivesphere-prod-backend
    restart: unless-stopped
    depends_on:
      drivesphere-db:
        condition: service_healthy
    networks:
      - drivesphere-internal
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://drivesphere-db:3306/${DB_NAME:-drivesphere}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DRIVESPHERE_DEMO_DATA_ENABLED: "false"
      DRIVESPHERE_PAYMENT_ALLOW_MOCK: "false"
      DRIVESPHERE_GPS_ALLOW_SIMULATION: "false"
      DRIVESPHERE_STORAGE_LOCAL_DIR: /app/uploads/documents
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-${ORS_API_KEY:-}}
      ORS_API_KEY: ${ORS_API_KEY:-${OPENROUTESERVICE_API_KEY:-}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: ${SMTP_FROM:-noreply@drivesphere.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://drivesphere.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://drivesphere.com}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - prod_uploads_data:/app/uploads/documents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  drivesphere-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drivesphere-prod-frontend
    restart: unless-stopped
    depends_on:
      - drivesphere-backend
    networks:
      - drivesphere-internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro

networks:
  drivesphere-internal:
    driver: bridge

volumes:
  prod_db_data:
  prod_uploads_data:
