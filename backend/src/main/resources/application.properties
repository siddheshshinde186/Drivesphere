# ===================================================================
# DriveSphere – Smart Mobility & Fleet Intelligence Platform
# Core Application Configuration
# ===================================================================

spring.application.name=drivesphere-backend
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Active Spring Profile (dev, test, prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.main.allow-circular-references=true

# Optional .env file loading (from project root or backend directory)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ===================================================================
# Database Configuration (MySQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/drivesphere?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA & Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migration (Managed per profile)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Security & JWT Configuration
# ===================================================================
drivesphere.jwt.secret=${DRIVESPHERE_JWT_SECRET:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
drivesphere.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
drivesphere.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===================================================================
# CORS Configuration
# ===================================================================
drivesphere.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173,http://localhost:8080}

# ===================================================================
# Third-Party Integrations (Standardized property naming)
# ===================================================================
# OpenRouteService / Maps
drivesphere.openrouteservice.api-key=${OPENROUTESERVICE_API_KEY:${ORS_API_KEY:}}
ors.api.key=${drivesphere.openrouteservice.api-key}

# Razorpay Payment Gateway
drivesphere.razorpay.key-id=${RAZORPAY_KEY_ID:}
drivesphere.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
drivesphere.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
drivesphere.payment.allow-mock=${DRIVESPHERE_PAYMENT_ALLOW_MOCK:false}
drivesphere.gps.allow-simulation=${DRIVESPHERE_GPS_ALLOW_SIMULATION:true}
razorpay.key-id=${drivesphere.razorpay.key-id}
razorpay.key-secret=${drivesphere.razorpay.key-secret}

# Cloudinary Media Asset Storage
drivesphere.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
drivesphere.cloudinary.api-key=${CLOUDINARY_API_KEY:}
drivesphere.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.cloud-name=${drivesphere.cloudinary.cloud-name}
cloudinary.api-key=${drivesphere.cloudinary.api-key}
cloudinary.api-secret=${drivesphere.cloudinary.api-secret}

# Google Gemini AI
drivesphere.gemini.api-key=${GEMINI_API_KEY:}
gemini.api.key=${drivesphere.gemini.api-key}
drivesphere.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.model=${drivesphere.gemini.model}

# Multipart File Upload Configuration (Avatars and Document Uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Local upload storage directory fallback
drivesphere.storage.local-dir=${UPLOAD_DIR:uploads/documents}
drivesphere.upload.dir=${UPLOAD_DIR:uploads/documents}

# ===================================================================
# Actuator & Observability
# ===================================================================
drivesphere.app.version=1.0.0
drivesphere.demo-data.enabled=${DRIVESPHERE_DEMO_DATA_ENABLED:false}

# Secure One-Time Initial Admin Provisioning (No hardcoded credentials)
drivesphere.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
drivesphere.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}

# ===================================================================
# Mail & Notifications (SMTP)
# ===================================================================
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
drivesphere.mail.from=${SMTP_FROM:${spring.mail.username:noreply@drivesphere.com}}
drivesphere.mail.frontend-url=${FRONTEND_URL:${drivesphere.app.frontend-url:http://localhost:8080}}
drivesphere.app.frontend-url=${FRONTEND_URL:http://localhost:8080}

# ===================================================================
# Observability & OpenAPI
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===================================================================
# Vehicle Maintenance & Servicing Policy
# ===================================================================
drivesphere.maintenance.interval-km=${MAINTENANCE_INTERVAL_KM:10000}
drivesphere.maintenance.interval-months=${MAINTENANCE_INTERVAL_MONTHS:6}
drivesphere.maintenance.warning-km=${MAINTENANCE_WARNING_KM:1000}
drivesphere.maintenance.warning-days=${MAINTENANCE_WARNING_DAYS:30}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=alpha
