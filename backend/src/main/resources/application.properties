# ===================================================================
# DriveSphere – Smart Mobility & Fleet Intelligence Platform
# Core Application Configuration
# ===================================================================

spring.application.name=drivesphere-backend
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ===================================================================
# Database Configuration (MySQL)
# Default connection targets local MySQL at port 3306, database drivesphere
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/drivesphere?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sid180666}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA & Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Security & JWT Configuration
# ===================================================================
drivesphere.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
drivesphere.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS Configuration (Local Frontend Development)
# ===================================================================
drivesphere.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173,http://localhost:8080}

# ===================================================================
# Third-Party Integrations (Bound to environment variables)
# ===================================================================
# AI & Routing
gemini.api.key=${GEMINI_API_KEY:}
drivesphere.gemini.api-key=${GEMINI_API_KEY:}
ors.api.key=${ORS_API_KEY:}

# Cloud Media & Payments
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
