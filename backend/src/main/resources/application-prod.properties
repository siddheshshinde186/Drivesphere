# ===================================================================
# DriveSphere – Production Profile (prod)
# Strictly enforces real gateways, validates database schema,
# and forbids mock payments and simulated GPS.
# ===================================================================
drivesphere.demo-data.enabled=false

# Strictly validate database against Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Forbid mock payments and demo simulation in production
drivesphere.payment.allow-mock=false
drivesphere.gps.allow-simulation=false

# OpenAPI / Swagger disabled in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Security & Observability
# Strictly require production JWT secret from environment (no fallback to default)
drivesphere.jwt.secret=${DRIVESPHERE_JWT_SECRET:${JWT_SECRET:}}
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health

