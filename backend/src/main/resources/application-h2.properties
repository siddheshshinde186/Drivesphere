# ===================================================================
# DriveSphere – Smart Mobility & Fleet Intelligence Platform
# H2 In-Memory Profile Configuration (application-h2.properties)
# Enables 100% out-of-the-box local execution with zero database setup
# ===================================================================

spring.datasource.url=jdbc:h2:mem:drivesphere;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Development & Test Allowances for Local In-Memory Demo
drivesphere.payment.allow-mock=true
drivesphere.gps.allow-simulation=true
