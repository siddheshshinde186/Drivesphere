# ===================================================================
# DriveSphere – Development Profile (dev)
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Development allows mock payment when credentials are unconfigured
drivesphere.payment.allow-mock=true
drivesphere.gps.allow-simulation=true
