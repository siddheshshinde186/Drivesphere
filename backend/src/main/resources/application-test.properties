# ===================================================================
# DriveSphere – Test Profile (test)
# In-memory H2 database with mock allowances for isolated unit/integration tests
# ===================================================================
spring.datasource.url=jdbc:h2:mem:drivesphere_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

drivesphere.payment.allow-mock=true
drivesphere.gps.allow-simulation=true

drivesphere.maintenance.interval-km=10000
drivesphere.maintenance.interval-months=6
drivesphere.maintenance.warning-km=1000
drivesphere.maintenance.warning-days=30
