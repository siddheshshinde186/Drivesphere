server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Production Edge Security Headers & Geolocation Permissions for GPS Telemetry
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enforce HTTP to HTTPS redirection when running behind a TLS termination proxy (Caddy, Traefik, Cloudflare, ALB)
    if ($http_x_forwarded_proto = 'http') {
        return 301 https://$host$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend Spring Boot service
    location /api/ {
        proxy_pass http://drivesphere-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploaded documents
    location /uploads/ {
        proxy_pass http://drivesphere-backend:8080/uploads/;
        proxy_set_header Host $host;
    }
}
